Summary: Alarm app with cognitive challenges
Description: |-
  AlarmX is a mobile alarm application that requires users to complete cognitive 
  challenges (e.g., arithmetic problems) to dismiss alarms.
  
  The app allows users to create and manage alarms, customize difficulty levels, 
  and configure preferences such as snooze behavior and sound settings.

